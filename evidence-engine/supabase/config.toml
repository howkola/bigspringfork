# Supabase local config for the Evidence-to-Proposal Engine.
# `project_id` is used to namespace the local stack; change if you run multiple projects.
project_id = "evidence-engine"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Set to your deployed web app URL in production.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false  # local dev convenience; require confirmations in prod

[functions.research-search]
verify_jwt = true

[functions.draft-section]
verify_jwt = true

[functions.verify-citation]
verify_jwt = true
